[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cijfercode"
version = "0.1.0"
description = "Generator en oplosser voor Nederlandse cijfercodepuzzels"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["wordfreq>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
cijfercode = "cijfercode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
